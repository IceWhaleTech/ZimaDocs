<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">Partilha por ligação no ZimaOS: arquitetura funcional</title><desc id="desc">A coordenação ajuda o dispositivo ZimaOS e o navegador do destinatário a estabelecer a ligação. Os dados cifrados são transferidos diretamente ou por retransmissão temporária cifrada. O navegador desencripta-os.</desc>
