<text x="292" y="367" font-size="29" font-weight="600" fill="#17233b" data-max-width="380">O seu dispositivo ZimaOS</text><text x="292" y="415" font-size="27" fill="#0057ff" data-max-width="380">Files · Photos</text><text x="292" y="460" font-size="22" fill="#64748b" data-max-width="380">Os originais ficam no seu dispositivo</text><text x="292" y="497" font-size="22" fill="#64748b" data-max-width="380">Verifica o acesso · Conteúdo a pedido</text>
