index:
  hero_title: Build Your Own Server.
  hero_subtitle: Everything you need to install ZimaOS on any x86 device, run your apps, and get the most out of ZimaCube, ZimaBoard, and ZimaBlade.
  get_started: Get started
  browse_docs: Browse all docs
  setup_title: Set it up.
  setup_subtitle: Start here after your first boot. Install ZimaOS, get your storage right, and make your files reachable from anywhere.
  setup_install_title: Install ZimaOS
  setup_install_body: Write the image to a USB drive, boot your device, and create your account. Proxmox VE and offline installs are covered too.
  setup_storage_title: Set up your storage
  setup_storage_body: Pick a RAID level, add your drives, and choose where app data lives. Single-disk and JBOD setups work too.
  setup_connect_title: Connect and share
  setup_connect_body: Reach your files from Finder and File Explorer on the local network, or from anywhere using remote access and share links.
  setup_link: Setup guides
  setup_install_alt: The ZimaOS first-boot welcome screen on a ZimaCube
  setup_storage_alt: Choosing a RAID level and adding drives in ZimaOS
  setup_connect_alt: Reaching ZimaOS files from Finder over the local network
  apps_title: Run your apps.
  apps_subtitle: Turn your device into a media server, a photo library, or a private AI box. Install with one click from the App Store, or use your own Docker Compose.
  apps_media_title: Media server
  apps_media_body: Jellyfin, Plex, or Emby, with GPU transcoding when you need it. Your library, on every screen in the house.
  apps_selfhosted_title: Self-hosted apps
  apps_selfhosted_body: Syncthing, Pi-hole, Paperless, and a few hundred more. Install from the App Store or bring your own Docker Compose.
  apps_ai_title: Local AI
  apps_ai_body: Run DeepSeek and other models on your own hardware. Add a GPU when you want more headroom.
  apps_link: Browse the playground
  apps_media_alt: A media library streaming from ZimaOS
  apps_selfhosted_alt: Self-hosted apps installed from the ZimaOS App Store
  apps_ai_alt: A local AI model answering a prompt on ZimaOS
  deeper_title: Go deeper.
  deeper_subtitle: RAID, ZFS, iSCSI, networking, and the ZimaOS API. For when the defaults stop being enough.
  deeper_storage_title: Storage and filesystems
  deeper_storage_body: ZFS pools, RAID 6, encrypted folders, iSCSI targets, and rebuilds that survive a reinstall.
  deeper_network_title: Networking and SSH
  deeper_network_body: Open a shell, set static addresses, tune transfer speeds, and connect to another NAS over SMB.
  deeper_api_title: API and contributing
  deeper_api_body: Publish a Docker app, call the ZimaOS OpenAPI, or send a pull request to the docs.
  deeper_link: Dev docs
  deeper_alt: The ZimaOS system information terminal
  news_title: What's new?
  news_tag: Latest release
