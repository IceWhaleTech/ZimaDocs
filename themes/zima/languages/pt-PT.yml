index:
  hero_title: Crie o seu próprio servidor.
  hero_subtitle: Tudo o que precisa para instalar o ZimaOS em qualquer dispositivo x86, executar as suas aplicações e tirar o máximo partido do ZimaCube, ZimaBoard e ZimaBlade.
  get_started: Começar
  browse_docs: Ver toda a documentação
  setup_title: Faça a configuração.
  setup_subtitle: Comece aqui após o primeiro arranque. Instale o ZimaOS, configure o armazenamento e torne os seus ficheiros acessíveis a partir de qualquer lugar.
  setup_install_title: Instalar o ZimaOS
  setup_install_body: Grave a imagem numa pen USB, inicie o dispositivo e crie a sua conta. Também estão incluídas instalações com Proxmox VE e sem ligação à Internet.
  setup_storage_title: Configurar o armazenamento
  setup_storage_body: Escolha um nível RAID, adicione os discos e defina onde ficam os dados das aplicações. Também pode utilizar um único disco ou JBOD.
  setup_connect_title: Ligar e partilhar
  setup_connect_body: Aceda aos ficheiros através do Finder ou do Explorador de Ficheiros na rede local, ou a partir de qualquer lugar com acesso remoto e ligações de partilha.
  setup_link: Guias de configuração
  setup_install_alt: Ecrã de boas-vindas do primeiro arranque do ZimaOS num ZimaCube
  setup_storage_alt: Seleção de um nível RAID e adição de discos no ZimaOS
  setup_connect_alt: Acesso aos ficheiros do ZimaOS através do Finder na rede local
  apps_title: Execute as suas aplicações.
  apps_subtitle: Transforme o dispositivo num servidor multimédia, numa biblioteca de fotografias ou num sistema de IA privado. Instale com um clique a partir da loja de aplicações ou utilize o seu próprio Docker Compose.
  apps_media_title: Servidor multimédia
  apps_media_body: Jellyfin, Plex ou Emby, com transcodificação por GPU quando necessário. A sua biblioteca em todos os ecrãs de casa.
  apps_selfhosted_title: Aplicações autoalojadas
  apps_selfhosted_body: Syncthing, Pi-hole, Paperless e centenas de outras aplicações. Instale-as a partir da loja de aplicações ou utilize o seu próprio Docker Compose.
  apps_ai_title: IA local
  apps_ai_body: Execute o DeepSeek e outros modelos no seu próprio hardware. Adicione uma GPU quando precisar de mais desempenho.
  apps_link: Explorar aplicações
  apps_media_alt: Uma biblioteca multimédia transmitida a partir do ZimaOS
  apps_selfhosted_alt: Aplicações autoalojadas instaladas a partir da loja de aplicações do ZimaOS
  apps_ai_alt: Um modelo de IA local a responder a um pedido no ZimaOS
  deeper_title: Vá mais longe.
  deeper_subtitle: RAID, ZFS, iSCSI, redes e a API do ZimaOS, para quando as predefinições deixarem de ser suficientes.
  deeper_storage_title: Armazenamento e sistemas de ficheiros
  deeper_storage_body: Pools ZFS, RAID 6, pastas encriptadas, destinos iSCSI e reconstruções que sobrevivem a uma reinstalação.
  deeper_network_title: Redes e SSH
  deeper_network_body: Abra uma shell, defina endereços estáticos, otimize as transferências e ligue-se a outro NAS através de SMB.
  deeper_api_title: API e contribuições
  deeper_api_body: Publique uma aplicação Docker, utilize a OpenAPI do ZimaOS ou envie um pedido de integração para a documentação.
  deeper_link: Documentação para programadores
  deeper_alt: Terminal de informações do sistema do ZimaOS
  news_title: Novidades
  news_tag: Versão mais recente
  news_headline: O ZimaOS %s já está disponível
  news_description: Consulte as novidades da versão mais recente e todo o histórico de versões desde a v1.2.2.
  news_link: Ler as notas de lançamento
  news_alt: Interface da loja de aplicações do ZimaOS
