index:
  hero_title: 自分だけのサーバーを構築。
  hero_subtitle: あらゆる x86 デバイスへの ZimaOS のインストール、アプリの実行、ZimaCube、ZimaBoard、ZimaBlade の活用に必要な情報をまとめています。
  get_started: はじめる
  browse_docs: すべてのドキュメントを見る
  setup_title: セットアップする。
  setup_subtitle: 初回起動後はここから始めましょう。ZimaOS をインストールし、ストレージを設定して、どこからでもファイルにアクセスできるようにします。
  setup_install_title: ZimaOS をインストール
  setup_install_body: イメージを USB ドライブに書き込み、デバイスを起動してアカウントを作成します。Proxmox VE とオフラインでのインストール方法も説明します。
  setup_storage_title: ストレージを設定
  setup_storage_body: RAID レベルを選択してドライブを追加し、アプリデータの保存場所を決めます。シングルディスクと JBOD にも対応しています。
  setup_connect_title: 接続と共有
  setup_connect_body: ローカルネットワークでは Finder やエクスプローラーから、外出先ではリモートアクセスや共有リンクからファイルにアクセスできます。
  setup_link: セットアップガイド
  setup_install_alt: ZimaCube に表示された ZimaOS 初回起動時のウェルカム画面
  setup_storage_alt: ZimaOS で RAID レベルを選択してドライブを追加する画面
  setup_connect_alt: ローカルネットワーク上の Finder から ZimaOS のファイルにアクセスする画面
  apps_title: アプリを動かす。
  apps_subtitle: デバイスをメディアサーバー、フォトライブラリ、プライベート AI 環境に変えられます。App Store からワンクリックでインストールすることも、独自の Docker Compose を使うこともできます。
  apps_media_title: メディアサーバー
  apps_media_body: Jellyfin、Plex、Emby を利用し、必要に応じて GPU トランスコードも有効にできます。家中のどの画面からでもライブラリを楽しめます。
  apps_selfhosted_title: セルフホストアプリ
  apps_selfhosted_body: Syncthing、Pi-hole、Paperless など数百のアプリを App Store からインストールするか、独自の Docker Compose を使用できます。
  apps_ai_title: ローカル AI
  apps_ai_body: DeepSeek などのモデルを自分のハードウェアで実行できます。さらに性能が必要なら GPU を追加できます。
  apps_link: アプリを探す
  apps_media_alt: ZimaOS からストリーミングされるメディアライブラリ
  apps_selfhosted_alt: ZimaOS App Store からインストールしたセルフホストアプリ
  apps_ai_alt: ZimaOS 上でプロンプトに回答するローカル AI モデル
  deeper_title: さらに使いこなす。
  deeper_subtitle: RAID、ZFS、iSCSI、ネットワーク、ZimaOS API。標準設定だけでは足りなくなったときのための情報です。
  deeper_storage_title: ストレージとファイルシステム
  deeper_storage_body: ZFS プール、RAID 6、暗号化フォルダー、iSCSI ターゲット、再インストール後の再構築について説明します。
  deeper_network_title: ネットワークと SSH
  deeper_network_body: シェルを開き、固定アドレスを設定し、転送速度を調整して、SMB 経由で別の NAS に接続します。
  deeper_api_title: API とコントリビューション
  deeper_api_body: Docker アプリの公開、ZimaOS OpenAPI の利用、ドキュメントへのプルリクエスト送信について説明します。
  deeper_link: 開発者向けドキュメント
  deeper_alt: ZimaOS のシステム情報ターミナル
  news_title: 最新情報
  news_tag: 最新リリース
  news_headline: ZimaOS %s を公開しました
