index:
  hero_title: Crea tu propio servidor.
  hero_subtitle: Todo lo que necesitas para instalar ZimaOS en cualquier dispositivo x86, ejecutar tus aplicaciones y aprovechar al máximo ZimaCube, ZimaBoard y ZimaBlade.
  get_started: Comenzar
  browse_docs: Ver toda la documentación
  setup_title: Configura tu servidor.
  setup_subtitle: Empieza aquí después del primer arranque. Instala ZimaOS, configura el almacenamiento y accede a tus archivos desde cualquier lugar.
  setup_install_title: Instalar ZimaOS
  setup_install_body: Graba la imagen en una memoria USB, inicia el dispositivo y crea tu cuenta. También se incluyen las instalaciones con Proxmox VE y sin conexión.
  setup_storage_title: Configurar el almacenamiento
  setup_storage_body: Elige un nivel RAID, añade tus unidades y decide dónde se guardan los datos de las aplicaciones. También puedes usar un solo disco o JBOD.
  setup_connect_title: Conectar y compartir
  setup_connect_body: Accede a tus archivos desde Finder o el Explorador de archivos en la red local, o desde cualquier lugar mediante acceso remoto y enlaces compartidos.
  setup_link: Guías de configuración
  setup_install_alt: Pantalla de bienvenida del primer arranque de ZimaOS en un ZimaCube
  setup_storage_alt: Selección de un nivel RAID y adición de unidades en ZimaOS
  setup_connect_alt: Acceso a archivos de ZimaOS desde Finder a través de la red local
  apps_title: Ejecuta tus aplicaciones.
  apps_subtitle: Convierte tu dispositivo en un servidor multimedia, una fototeca o un sistema de IA privado. Instala con un clic desde la tienda de apps o usa tu propio Docker Compose.
  apps_media_title: Servidor multimedia
  apps_media_body: Jellyfin, Plex o Emby, con transcodificación por GPU cuando la necesites. Tu biblioteca, en todas las pantallas de casa.
  apps_selfhosted_title: Aplicaciones autoalojadas
  apps_selfhosted_body: Syncthing, Pi-hole, Paperless y cientos de aplicaciones más. Instálalas desde la tienda de apps o usa tu propio Docker Compose.
  apps_ai_title: IA local
  apps_ai_body: Ejecuta DeepSeek y otros modelos en tu propio hardware. Añade una GPU cuando necesites más rendimiento.
  apps_link: Explorar aplicaciones
  apps_media_alt: Una biblioteca multimedia transmitida desde ZimaOS
  apps_selfhosted_alt: Aplicaciones autoalojadas instaladas desde la tienda de apps de ZimaOS
  apps_ai_alt: Un modelo de IA local respondiendo a una consulta en ZimaOS
  deeper_title: Ve más allá.
  deeper_subtitle: RAID, ZFS, iSCSI, redes y la API de ZimaOS, para cuando la configuración predeterminada ya no sea suficiente.
  deeper_storage_title: Almacenamiento y sistemas de archivos
  deeper_storage_body: Grupos ZFS, RAID 6, carpetas cifradas, destinos iSCSI y reconstrucciones que sobreviven a una reinstalación.
  deeper_network_title: Redes y SSH
  deeper_network_body: Abre una terminal, configura direcciones estáticas, optimiza las transferencias y conecta otro NAS mediante SMB.
  deeper_api_title: API y contribuciones
  deeper_api_body: Publica una aplicación Docker, utiliza la OpenAPI de ZimaOS o envía una solicitud de cambios a la documentación.
  deeper_link: Documentación para desarrolladores
  deeper_alt: Terminal de información del sistema de ZimaOS
  news_title: ¿Qué hay de nuevo?
  news_tag: Última versión
  news_headline: ZimaOS %s ya está disponible
  news_description: Descubre las novedades de la última versión y consulta el historial completo desde la versión v1.2.2.
  news_link: Leer las notas de la versión
  news_alt: Interfaz de la tienda de apps de ZimaOS
