index:
  hero_title: 构建你自己的服务器。
  hero_subtitle: 从在任意 x86 设备上安装 ZimaOS，到运行应用，再到充分发挥 ZimaCube、ZimaBoard 和 ZimaBlade 的潜力，这里提供你所需的一切资料。
  get_started: 开始使用
  browse_docs: 浏览全部文档
  setup_title: 完成初始设置。
  setup_subtitle: 首次启动后从这里开始。安装 ZimaOS、配置好存储，并让你能随时随地访问文件。
  setup_install_title: 安装 ZimaOS
  setup_install_body: 将系统镜像写入 U 盘，启动设备并创建账户。这里也包括 Proxmox VE 和离线安装方式。
  setup_storage_title: 配置存储
  setup_storage_body: 选择 RAID 级别、添加硬盘，并决定应用数据的存放位置。单盘和 JBOD 配置同样适用。
  setup_connect_title: 连接与共享
  setup_connect_body: 在局域网中通过 Finder 或文件资源管理器访问文件，也可以使用远程访问和分享链接随时随地连接。
  setup_link: 设置指南
  setup_install_alt: ZimaCube 上的 ZimaOS 首次启动欢迎界面
  setup_storage_alt: 在 ZimaOS 中选择 RAID 级别并添加硬盘
  setup_connect_alt: 通过局域网中的 Finder 访问 ZimaOS 文件
  apps_title: 运行你的应用。
  apps_subtitle: 将设备变成媒体服务器、照片库或私有 AI 主机。既可从应用商店一键安装，也可使用自己的 Docker Compose。
  apps_media_title: 媒体服务器
  apps_media_body: 使用 Jellyfin、Plex 或 Emby，并在需要时启用 GPU 转码，让家中每一块屏幕都能访问你的媒体库。
  apps_selfhosted_title: 自托管应用
  apps_selfhosted_body: Syncthing、Pi-hole、Paperless，以及数百款其他应用。可从应用商店安装，也可使用自己的 Docker Compose。
  apps_ai_title: 本地 AI
  apps_ai_body: 在自己的硬件上运行 DeepSeek 和其他模型；需要更强性能时，还可以添加 GPU。
  apps_link: 浏览应用场景
  apps_media_alt: 从 ZimaOS 串流播放的媒体库
  apps_selfhosted_alt: 从 ZimaOS 应用商店安装的自托管应用
  apps_ai_alt: 在 ZimaOS 上回答提示词的本地 AI 模型
  deeper_title: 探索高级功能。
  deeper_subtitle: RAID、ZFS、iSCSI、网络与 ZimaOS API，适合默认设置已无法满足需求的场景。
  deeper_storage_title: 存储与文件系统
  deeper_storage_body: 配置 ZFS 存储池、RAID 6、加密文件夹和 iSCSI 目标，并了解系统重装后的阵列重建。
  deeper_network_title: 网络与 SSH
  deeper_network_body: 打开终端、设置静态地址、优化传输速度，并通过 SMB 连接另一台 NAS。
  deeper_api_title: API 与贡献
  deeper_api_body: 发布 Docker 应用、调用 ZimaOS OpenAPI，或向文档项目提交拉取请求。
  deeper_link: 开发者文档
  deeper_alt: ZimaOS 系统信息终端
  news_title: 最新动态
  news_tag: 最新版本
  news_headline: ZimaOS %s 已发布
  news_description: 查看最新版本包含的更新，并浏览从 v1.2.2 至今的完整版本历史。
  news_link: 阅读发行说明
  news_alt: ZimaOS 应用商店界面
