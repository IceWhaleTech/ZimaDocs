<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">ZVM Next safer virtual machine workflows</title><desc id="desc">Four hand-drawn cards show image import, understandable networking, recovery, and compatibility as the main ZVM Next workstreams.</desc>
<defs>
 <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#d9d3c7" opacity="0.45"/></pattern>
 <filter id="rough" x="-4%" y="-4%" width="108%" height="108%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.25" xChannelSelector="R" yChannelSelector="G"/></filter>
 <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#233044" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fffaf0"/><rect width="100%" height="100%" fill="url(#dots)"/>
<text x="800" y="129.72" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="58" font-weight="700" fill="#233044"><tspan x="800" dy="0">ZVM Next: safer VM workflows</tspan></text>
<text x="800" y="192.7" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="30" font-weight="500" fill="#617084"><tspan x="800" dy="0">Built around real community needs - with the limits shown clearly</tspan></text>
<rect x="70" y="285" width="320" height="330" rx="22" fill="#d9ecff" stroke="#4a90e2" stroke-width="3" filter="url(#rough)"/>
<text x="230" y="348.4" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="32" font-weight="700" fill="#233044"><tspan x="230" dy="0">IMPORT WHAT</tspan><tspan x="230" dy="40.96">YOU HAVE</tspan></text>
<path d="M 125 420 L 335 420" fill="none" stroke="#4a90e2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)"/>
<text x="230" y="473.8" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="24" font-weight="500" fill="#617084"><tspan x="230" dy="0">ISO / QCOW2 / VDI</tspan><tspan x="230" dy="30.72">VMDK / raw / OVA</tspan></text>
<rect x="125" y="545" width="210" height="46" rx="22" fill="#4a90e2" stroke="#4a90e2" stroke-width="3" filter="url(#rough)"/>
<text x="230" y="574.46" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="19" font-weight="700" fill="#ffffff"><tspan x="230" dy="0">IN VALIDATION</tspan></text>
<path d="M 230 622 L 230 695" fill="none" stroke="#4a90e2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" filter="url(#rough)"/>
<rect x="450" y="285" width="320" height="330" rx="22" fill="#d8f3ee" stroke="#35a7a0" stroke-width="3" filter="url(#rough)"/>
<text x="610" y="348.4" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="32" font-weight="700" fill="#233044"><tspan x="610" dy="0">UNDERSTAND</tspan><tspan x="610" dy="40.96">THE NETWORK</tspan></text>
<path d="M 505 420 L 715 420" fill="none" stroke="#35a7a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)"/>
<text x="610" y="473.8" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="24" font-weight="500" fill="#617084"><tspan x="610" dy="0">NAT / bridge / macvtap</tspan><tspan x="610" dy="30.72">disconnected</tspan></text>
<rect x="505" y="545" width="210" height="46" rx="22" fill="#35a7a0" stroke="#35a7a0" stroke-width="3" filter="url(#rough)"/>
<text x="610" y="574.46" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="19" font-weight="700" fill="#ffffff"><tspan x="610" dy="0">PROTOTYPE</tspan></text>
<path d="M 610 622 L 610 695" fill="none" stroke="#35a7a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" filter="url(#rough)"/>
<rect x="830" y="285" width="320" height="330" rx="22" fill="#dff3e4" stroke="#5caf6f" stroke-width="3" filter="url(#rough)"/>
<text x="990" y="348.4" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="32" font-weight="700" fill="#233044"><tspan x="990" dy="0">RECOVER WITH</tspan><tspan x="990" dy="40.96">CONFIDENCE</tspan></text>
<path d="M 885 420 L 1095 420" fill="none" stroke="#5caf6f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)"/>
<text x="990" y="473.8" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="24" font-weight="500" fill="#617084"><tspan x="990" dy="0">disk snapshots</tspan><tspan x="990" dy="30.72">independent backups</tspan></text>
<rect x="885" y="545" width="210" height="46" rx="22" fill="#5caf6f" stroke="#5caf6f" stroke-width="3" filter="url(#rough)"/>
<text x="990" y="574.46" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="19" font-weight="700" fill="#ffffff"><tspan x="990" dy="0">PROTOTYPE</tspan></text>
<path d="M 990 622 L 990 695" fill="none" stroke="#5caf6f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" filter="url(#rough)"/>
<rect x="1210" y="285" width="320" height="330" rx="22" fill="#fff0c2" stroke="#e5a93d" stroke-width="3" filter="url(#rough)"/>
<text x="1370" y="348.4" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="32" font-weight="700" fill="#233044"><tspan x="1370" dy="0">PROTECT WHAT</tspan><tspan x="1370" dy="40.96">ALREADY WORKS</tspan></text>
<path d="M 1265 420 L 1475 420" fill="none" stroke="#e5a93d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)"/>
<text x="1370" y="473.8" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="24" font-weight="500" fill="#617084"><tspan x="1370" dy="0">additive changes</tspan><tspan x="1370" dy="30.72">clear failure paths</tspan></text>
<rect x="1265" y="545" width="210" height="46" rx="22" fill="#e5a93d" stroke="#e5a93d" stroke-width="3" filter="url(#rough)"/>
<text x="1370" y="574.46" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="19" font-weight="700" fill="#ffffff"><tspan x="1370" dy="0">CORE PRINCIPLE</tspan></text>
<path d="M 1370 622 L 1370 695" fill="none" stroke="#e5a93d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" filter="url(#rough)"/>
<rect x="260" y="710" width="1080" height="105" rx="22" fill="#ffffff" stroke="#233044" stroke-width="3" filter="url(#rough)"/>
<text x="800" y="771.06" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="34" font-weight="700" fill="#233044"><tspan x="800" dy="0">Understandable. Recoverable. Safe for the next reboot.</tspan></text>
<path d="M 220 120 L 310 98" fill="none" stroke="#e96b5b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)"/>
<path d="M 1285 125 L 1380 149" fill="none" stroke="#35a7a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)"/>
</svg>
