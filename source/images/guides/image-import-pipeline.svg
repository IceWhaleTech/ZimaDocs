<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
<title id="title">ZVM image import pipeline</title><desc id="desc">A five-step hand-drawn flow shows source selection, content detection, verification, preparation, atomic finalization, and cleanup after cancellation or failure.</desc>
<defs>
 <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#d9d3c7" opacity="0.45"/></pattern>
 <filter id="rough" x="-4%" y="-4%" width="108%" height="108%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.25" xChannelSelector="R" yChannelSelector="G"/></filter>
 <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#233044" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fffaf0"/><rect width="100%" height="100%" fill="url(#dots)"/>
<text x="800" y="107.36" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="54" font-weight="700" fill="#233044"><tspan x="800" dy="0">From source file to a VM-ready disk</tspan></text>
<text x="800" y="164.86" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="29" font-weight="500" fill="#617084"><tspan x="800" dy="0">One managed path, with cleanup built into every step</tspan></text>
<rect x="45" y="235" width="245" height="260" rx="22" fill="#d9ecff" stroke="#4a90e2" stroke-width="3" transform="rotate(-0.2864788975654116 167.5 365)" filter="url(#rough)"/>
<text x="167.5" y="292.84" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="26" font-weight="700" fill="#233044"><tspan x="167.5" dy="0">CHOOSE SOURCE</tspan></text>
<path d="M 83 325 L 252 325" fill="none" stroke="#4a90e2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)"/>
<text x="167.5" y="377.38" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="23" font-weight="500" fill="#617084"><tspan x="167.5" dy="0">Upload</tspan><tspan x="167.5" dy="29.44">ZimaOS Files</tspan><tspan x="167.5" dy="29.44">URL or template</tspan></text>
<path d="M 297 365 L 380 365" fill="none" stroke="#233044" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" filter="url(#rough)"/>
<rect x="350" y="235" width="245" height="260" rx="22" fill="#d8f3ee" stroke="#35a7a0" stroke-width="3" transform="rotate(0.2864788975654116 472.5 365)" filter="url(#rough)"/>
<text x="472.5" y="292.84" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="26" font-weight="700" fill="#233044"><tspan x="472.5" dy="0">DETECT</tspan></text>
<path d="M 388 325 L 557 325" fill="none" stroke="#35a7a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)"/>
<text x="472.5" y="377.38" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="23" font-weight="500" fill="#617084"><tspan x="472.5" dy="0">Inspect content</tspan><tspan x="472.5" dy="29.44">not just the</tspan><tspan x="472.5" dy="29.44">file extension</tspan></text>
<path d="M 602 365 L 685 365" fill="none" stroke="#233044" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" filter="url(#rough)"/>
<rect x="655" y="235" width="245" height="260" rx="22" fill="#fff0c2" stroke="#e5a93d" stroke-width="3" transform="rotate(-0.2864788975654116 777.5 365)" filter="url(#rough)"/>
<text x="777.5" y="292.84" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="26" font-weight="700" fill="#233044"><tspan x="777.5" dy="0">VERIFY</tspan></text>
<path d="M 693 325 L 862 325" fill="none" stroke="#e5a93d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)"/>
<text x="777.5" y="377.38" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="23" font-weight="500" fill="#617084"><tspan x="777.5" dy="0">Format check</tspan><tspan x="777.5" dy="29.44">OVA safety</tspan><tspan x="777.5" dy="29.44">optional SHA-256</tspan></text>
<path d="M 907 365 L 990 365" fill="none" stroke="#233044" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" filter="url(#rough)"/>
<rect x="960" y="235" width="245" height="260" rx="22" fill="#ffe1dc" stroke="#e96b5b" stroke-width="3" transform="rotate(0.2864788975654116 1082.5 365)" filter="url(#rough)"/>
<text x="1082.5" y="292.84" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="26" font-weight="700" fill="#233044"><tspan x="1082.5" dy="0">PREPARE</tspan></text>
<path d="M 998 325 L 1167 325" fill="none" stroke="#e96b5b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)"/>
<text x="1082.5" y="377.38" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="23" font-weight="500" fill="#617084"><tspan x="1082.5" dy="0">Copy or convert</tspan><tspan x="1082.5" dy="29.44">into a sparse</tspan><tspan x="1082.5" dy="29.44">.partial file</tspan></text>
<path d="M 1212 365 L 1295 365" fill="none" stroke="#233044" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" filter="url(#rough)"/>
<rect x="1265" y="235" width="245" height="260" rx="22" fill="#dff3e4" stroke="#5caf6f" stroke-width="3" transform="rotate(-0.2864788975654116 1387.5 365)" filter="url(#rough)"/>
<text x="1387.5" y="292.84" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="26" font-weight="700" fill="#233044"><tspan x="1387.5" dy="0">FINALIZE</tspan></text>
<path d="M 1303 325 L 1472 325" fill="none" stroke="#5caf6f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)"/>
<text x="1387.5" y="377.38" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="23" font-weight="500" fill="#617084"><tspan x="1387.5" dy="0">Sync + verify</tspan><tspan x="1387.5" dy="29.44">atomic rename</tspan><tspan x="1387.5" dy="29.44">VM-ready copy</tspan></text>
<path d="M 777 500 L 777 590" fill="none" stroke="#e96b5b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" filter="url(#rough)"/>
<rect x="480" y="610" width="640" height="105" rx="22" fill="#ffffff" stroke="#e96b5b" stroke-width="3" filter="url(#rough)"/>
<text x="800" y="652.18" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="27" font-weight="700" fill="#e96b5b"><tspan x="800" dy="0">CANCEL OR FAILURE?</tspan></text>
<text x="800" y="688.82" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="23" font-weight="500" fill="#233044"><tspan x="800" dy="0">Remove temporary data - never present it as ready</tspan></text>
<text x="800" y="785.52" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="28" font-weight="700" fill="#233044"><tspan x="800" dy="0">The VM points to the managed copy, not the original upload.</tspan></text>
</svg>
