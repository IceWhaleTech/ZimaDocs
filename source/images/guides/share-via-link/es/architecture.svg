<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">Compartir mediante un enlace en ZimaOS: arquitectura funcional</title><desc id="desc">La coordinación conecta el dispositivo ZimaOS y el navegador del destinatario. Los datos cifrados viajan directamente o mediante una retransmisión temporal cifrada. El navegador los descifra.</desc>
