<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">ZimaOS link sharing: functional architecture</title><desc id="desc">Connection coordination helps a ZimaOS device and a recipient browser connect. Encrypted data can travel directly or through a temporary encrypted relay. The browser decrypts it.</desc>
<defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0057ff"/></marker><marker id="grey" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7b879a"/></marker></defs>
<rect width="1440" height="820" rx="28" fill="#f6f8fc"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
<text x="720" y="55" fill="#64748b" font-size="21" data-max-width="1300">Content from your device · Decrypted and displayed at the recipient</text>
<path d="M550 190H292V310" fill="none" stroke="#7b879a" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#grey)"/>
<path d="M890 190H1148V310" fill="none" stroke="#7b879a" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#grey)"/>
<text x="345" y="168" font-size="21" fill="#64748b" data-max-width="350">Connection coordination</text><text x="1095" y="168" font-size="21" fill="#64748b" data-max-width="350">Connection coordination</text>
<rect x="550" y="105" width="340" height="115" rx="20" fill="#fff" stroke="#dce3ee" stroke-width="2"/>
<text x="720" y="152" font-size="26" font-weight="600" fill="#17233b" data-max-width="310">Connection coordination</text><text x="720" y="190" font-size="21" fill="#64748b" data-max-width="310">Helps both ends connect</text>
<rect x="82" y="310" width="420" height="240" rx="24" fill="#fff" stroke="#c5d6ff" stroke-width="2"/>
<text x="292" y="367" font-size="29" font-weight="600" fill="#17233b" data-max-width="380">Your ZimaOS device</text><text x="292" y="415" font-size="27" fill="#0057ff" data-max-width="380">Files · Photos</text><text x="292" y="460" font-size="22" fill="#64748b" data-max-width="380">Original files stay on your device</text><text x="292" y="497" font-size="22" fill="#64748b" data-max-width="380">Access checks · Content on demand</text>
<rect x="938" y="310" width="420" height="240" rx="24" fill="#fff" stroke="#c5d6ff" stroke-width="2"/>
<text x="1148" y="367" font-size="29" font-weight="600" fill="#17233b" data-max-width="380">Recipient’s browser</text><text x="1148" y="415" font-size="26" fill="#0057ff" data-max-width="380">Decrypt · Verify</text><text x="1148" y="460" font-size="22" fill="#64748b" data-max-width="380">Browse · Preview · Download</text><text x="1148" y="497" font-size="22" fill="#64748b" data-max-width="380">No recipient account required</text>
<path d="M502 419H928" fill="none" stroke="#0057ff" stroke-width="4" marker-end="url(#blue)"/>
<text x="720" y="365" font-size="23" fill="#0057ff" data-max-width="400">Direct transfer when available</text><text x="720" y="394" font-size="20" fill="#64748b" data-max-width="400">End-to-end encryption</text>
<path d="M292 550V660H540" fill="none" stroke="#0057ff" stroke-width="4" marker-end="url(#blue)"/>
<path d="M900 660H1148V560" fill="none" stroke="#0057ff" stroke-width="4" marker-end="url(#blue)"/>
<rect x="550" y="598" width="340" height="127" rx="22" fill="#edf3ff" stroke="#c5d6ff" stroke-width="2"/>
<text x="720" y="648" font-size="27" font-weight="600" fill="#0057ff" data-max-width="310">Encrypted relay</text><text x="720" y="688" font-size="21" fill="#64748b" data-max-width="310">Temporary encrypted segments</text>
<text x="420" y="608" font-size="21" fill="#64748b" data-max-width="220"><tspan x="420" y="608">Relay needed:</tspan><tspan x="420" y="638">Encrypt first</tspan></text><text x="1020" y="608" font-size="21" fill="#64748b" data-max-width="220"><tspan x="1020" y="608">Data remains</tspan><tspan x="1020" y="638">encrypted</tspan></text><text x="720" y="782" font-size="20" fill="#64748b" data-max-width="1320">Solid: file data · Dashed: connection coordination · Paths depend on network conditions</text>
