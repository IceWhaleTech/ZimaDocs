<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">ZVM virtual machine network modes</title><desc id="desc">Four hand-drawn topology cards compare NAT, Linux bridge, macvtap, and disconnected networking. Linux bridge connects both host and VM through br0, while macvtap gives both LAN access but commonly blocks direct host-to-guest communication.</desc>
<defs><pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#d9d3c7" opacity="0.45"/></pattern><filter id="rough" x="-4%" y="-4%" width="108%" height="108%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.25" xChannelSelector="R" yChannelSelector="G"/></filter><marker id="arrowhead" markerWidth="11" markerHeight="11" refX="5.5" refY="5.5" orient="auto-start-reverse"><path d="M1,1 L10,5.5 L1,10" fill="none" stroke="#233044" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="100%" height="100%" fill="#fffaf0"/><rect width="100%" height="100%" fill="url(#dots)"/>
<text x="800" y="102.18" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="52" font-weight="700" fill="#233044"><tspan x="800" dy="0">Four network modes, four different behaviors</tspan></text>
<text x="800" y="161.52" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-size="28" font-weight="500" fill="#617084"><tspan x="800" dy="0">The topology should be clear before you press Save</tspan></text>
